services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradevault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradevault}
      POSTGRES_DB: ${POSTGRES_DB:-tradevault}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradevault} -d ${POSTGRES_DB:-tradevault}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-tradevault}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-tradevault} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: npm run start -w api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradevault}:${POSTGRES_PASSWORD:-tradevault}@postgres:5432/${POSTGRES_DB:-tradevault}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-tradevault}@redis:6379
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: npm run start -w worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradevault}:${POSTGRES_PASSWORD:-tradevault}@postgres:5432/${POSTGRES_DB:-tradevault}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-tradevault}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 3000
      API_URL: http://api:4000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
